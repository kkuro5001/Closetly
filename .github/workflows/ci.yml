name: Closetly-CI

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      #Go build
      - name: Build & Push Go
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/closetly-go:latest .go
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/closetly-go:latest

      # Python build
      - name: Build & Push Python
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/closetly-python:latest ./python
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/closetly-python:latest