name: Closetly-CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Debug Docker Username
        run: |
          echo "X${{ secrets.DOCKERHUB_USERNAME }}X"

      - name: Test Go
        working-directory: Go
        run: go test ./...

      - name: Test Python
        working-directory: Python
        run: python -m compileall .

      # GoをビルドしてDocker Hubにプッシュ
      - name: Build Go
        run: |
          docker build \
            -t "${{ secrets.DOCKERHUB_USERNAME }}/closetly-go:${{ github.sha }}" \
            ./Go

      - name: Push Go
        run: |
          docker push \
            "${{ secrets.DOCKERHUB_USERNAME }}/closetly-go:${{ github.sha }}"

      # PythonをビルドしてDocker Hubにプッシュ
      - name: Build Python
        run: |
          docker build \
            -t "${{ secrets.DOCKERHUB_USERNAME }}/closetly-python:${{ github.sha }}" \
            ./Python

      - name: Push Python
        run: |
          docker push \
            "${{ secrets.DOCKERHUB_USERNAME }}/closetly-python:${{ github.sha }}"