server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # デプロイ直後から新しい版が届くよう、アプリの入り口になるファイルはキャッシュさせない
    # (Cloudflareもオリジンのno-cacheに従い、エッジに古いファイルを残さない)
    location ~* ^/(index\.html|main\.dart\.js|flutter\.js|flutter_bootstrap\.js|flutter_service_worker\.js|version\.json|manifest\.json)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # "/" はindex.htmlを返すので同じくキャッシュさせない
    location = / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files /index.html =404;
    }
}
